<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopReview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #666;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 50px;
        }

        .password-toggle button {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            transition: color 0.3s ease;
        }

        .password-toggle button:hover {
            color: #667eea;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }



        .signup-link {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #065f46;
            display: none;
        }

        .error-message.show,
        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>ShopReview</h1>
                <p>Login to your account</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                            autocomplete="current-password">
                        <button type="button" id="togglePassword">👁️</button>
                    </div>
                </div>

                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>



            <div class="signup-link">
                Don't have an account? <a href="#" id="signupLink">Sign up</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Login page specific functionality
        document.addEventListener('DOMContentLoaded', () => {
            initializeLoginPage();
        });

        function initializeLoginPage() {
            const loginForm = document.getElementById('loginForm');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const signupLink = document.getElementById('signupLink');
            const forgotPasswordLink = document.querySelector('.forgot-password');

            // Toggle password visibility
            if (togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }

            // Handle form submission
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }

            // Handle signup link
            if (signupLink) {
                signupLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showSignupForm();
                });
            }

            // Handle forgot password
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showForgotPasswordForm();
                });
            }

            // Check for saved email
            const savedEmail = localStorage.getItem('rememberedEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            const errorMessage = document.getElementById('errorMessage');

            // Clear previous messages
            hideMessages();

            // Validate input
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            // Validate email format
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showError('Please enter a valid email address');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            // Disable button and show loading
            loginBtn.disabled = true;
            loginText.textContent = 'Logging in...';
            loginSpinner.style.display = 'inline-block';

            try {
                // Send login request
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Handle successful login
                    showSuccess('Login successful! Redirecting...');

                    // Save token and user info
                    localStorage.setItem('token', data.user.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Remember email if requested
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    // Redirect to home page
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    // Handle error
                    showError(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please try again.');
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loginText.textContent = 'Login';
                loginSpinner.style.display = 'none';
            }
        }

        function showSignupForm() {
            // Replace login form with signup form
            const loginCard = document.querySelector('.login-card');
            loginCard.innerHTML = `
                <div class="login-header">
                    <h1>ShopReview</h1>
                    <p>Create your account</p>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" name="username" placeholder="Choose a username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="password-toggle">
                            <input type="password" id="signupPassword" name="password" placeholder="Enter your password" required autocomplete="new-password">
                            <button type="button" id="toggleSignupPassword">👁️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <div class="password-toggle">
                            <input type="password" id="signupConfirmPassword" name="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                            <button type="button" id="toggleSignupConfirmPassword">👁️</button>
                        </div>
                    </div>

                    <button type="submit" id="signupBtn" class="login-btn">
                        <span id="signupText">Sign Up</span>
                        <span id="signupSpinner" class="loading-spinner" style="display: none;"></span>
                    </button>
                </form>



                <div class="signup-link">
                    Already have an account? <a href="#" id="loginLink">Login</a>
                </div>
            `;

            // Re-initialize event listeners for signup form
            const toggleSignupPasswordBtn = document.getElementById('toggleSignupPassword');
            const signupPasswordInput = document.getElementById('signupPassword');
            const toggleSignupConfirmPasswordBtn = document.getElementById('toggleSignupConfirmPassword');
            const signupConfirmPasswordInput = document.getElementById('signupConfirmPassword');
            const loginLink = document.getElementById('loginLink');
            const signupForm = document.getElementById('signupForm');

            // Toggle password visibility
            if (toggleSignupPasswordBtn) {
                toggleSignupPasswordBtn.addEventListener('click', () => {
                    const type = signupPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    signupPasswordInput.setAttribute('type', type);
                    toggleSignupPasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }

            if (toggleSignupConfirmPasswordBtn) {
                toggleSignupConfirmPasswordBtn.addEventListener('click', () => {
                    const type = signupConfirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    signupConfirmPasswordInput.setAttribute('type', type);
                    toggleSignupConfirmPasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }

            // Handle login link
            if (loginLink) {
                loginLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.reload(); // Reload to show login form
                });
            }

            // Handle signup form submission
            if (signupForm) {
                signupForm.addEventListener('submit', handleSignup);
            }
        }

        async function handleSignup(e) {
            e.preventDefault();

            const username = document.getElementById('signupUsername').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const signupBtn = document.getElementById('signupBtn');
            const signupText = document.getElementById('signupText');
            const signupSpinner = document.getElementById('signupSpinner');
            const errorMessage = document.getElementById('errorMessage');

            // Clear previous messages
            hideMessages();

            // Validate input
            if (!username || !email || !password || !confirmPassword) {
                showError('All fields are required');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            // Validate email format
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showError('Please enter a valid email address');
                return;
            }

            // Disable button and show loading
            signupBtn.disabled = true;
            signupText.textContent = 'Signing up...';
            signupSpinner.style.display = 'inline-block';

            try {
                // Send signup request
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Handle successful signup
                    showSuccess('Signup successful! Redirecting...');

                    // Save token and user info
                    localStorage.setItem('token', data.user.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect to home page
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    // Handle error
                    showError(data.message || 'Signup failed');
                }
            } catch (error) {
                console.error('Signup error:', error);
                showError('Network error. Please try again.');
            } finally {
                // Re-enable button
                signupBtn.disabled = false;
                signupText.textContent = 'Sign Up';
                signupSpinner.style.display = 'none';
            }
        }

        function showForgotPasswordForm() {
            // Show forgot password form (will be implemented later)
            alert('Forgot password functionality will be implemented soon!');
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }
    </script>
</body>

</html>
